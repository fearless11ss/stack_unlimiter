import groovy.json.JsonSlurper

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Development-only integration-test support. The published mod does not
    // declare Fabric API as a runtime dependency.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

loom {
    mods {
        stack_unlimiter {
            sourceSet sourceSets.main
        }
        stack_unlimiter_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            server()
            name = 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir 'build/gametest'
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'loader_version', loader_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: minecraft_version,
                loader_version: loader_version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_description: mod_description
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def verifyRemappedMixinRefmap = tasks.register('verifyRemappedMixinRefmap') {
    dependsOn tasks.named('remapJar')

    doLast {
        def remappedJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def refmapFiles = zipTree(remappedJar).matching {
            include '*-refmap.json'
        }.files
        if (refmapFiles.size() != 1) {
            throw new GradleException("Expected one mixin refmap in ${remappedJar.name}, found ${refmapFiles.size()}")
        }

        def refmap = new JsonSlurper().parse(refmapFiles.first())
        def intermediaryMappings = refmap.data?.get('named:intermediary') ?: refmap.mappings
        def itemStackMixin = intermediaryMappings?.get(
                'dev/asp1r/stackunlimiter/mixin/ItemStackMixin'
        )
        if (!itemStackMixin) {
            throw new GradleException(
                    'ItemStackMixin is absent from the named-to-intermediary refmap; '
                            + 'the remapped release JAR will crash outside the development environment'
            )
        }
        def shulkerBoxMixin = intermediaryMappings?.get(
                'dev/asp1r/stackunlimiter/mixin/ShulkerBoxBlockMixin'
        )
        if (!shulkerBoxMixin?.get('appendHoverText')) {
            throw new GradleException(
                    'ShulkerBoxBlockMixin.appendHoverText is absent from the named-to-intermediary refmap; '
                            + 'the remapped release JAR will not display exact shulker counts'
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyRemappedMixinRefmap
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE.txt')) {
        rename { "LICENSE_${mod_id}.txt" }
    }
}
